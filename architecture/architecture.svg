<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>text{font-family:Arial,sans-serif;fill:#202124} .box{fill:#fff;stroke:#30343b;stroke-width:2;rx:12} .band{fill:#eef5f4;stroke:#2c6663;stroke-width:2;rx:12} .data{fill:#fff5e6;stroke:#9b6b2b;stroke-width:2;rx:12} .line{stroke:#555;stroke-width:2;fill:none;marker-end:url(#arrow)} .small{font-size:16px}.title{font-size:22px;font-weight:bold}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#555"/></marker></defs>
<text x="60" y="55" class="title">Production Vacation-Rental Marketplace</text>
<rect x="60" y="85" width="180" height="70" class="box"/><text x="150" y="126" text-anchor="middle" class="title">Users</text>
<rect x="330" y="85" width="220" height="70" class="band"/><text x="440" y="116" text-anchor="middle" class="title">CDN / Edge / WAF</text><text x="440" y="140" text-anchor="middle" class="small">TLS, rate limits, bot defense</text>
<rect x="640" y="85" width="220" height="70" class="box"/><text x="750" y="116" text-anchor="middle" class="title">Frontend</text><text x="750" y="140" text-anchor="middle" class="small">React SSR/static shell</text>
<rect x="950" y="85" width="220" height="70" class="band"/><text x="1060" y="116" text-anchor="middle" class="title">API Gateway</text><text x="1060" y="140" text-anchor="middle" class="small">Auth, routing, quotas</text>
<path d="M240 120h90M550 120h90M860 120h90" class="line"/>
<rect x="475" y="250" width="450" height="300" class="box"/><text x="700" y="285" text-anchor="middle" class="title">Backend Services</text>
<g class="small"><rect x="510" y="315" width="180" height="43" class="band"/><text x="600" y="342" text-anchor="middle">Authentication</text><rect x="710" y="315" width="180" height="43" class="band"/><text x="800" y="342" text-anchor="middle">Listings</text><rect x="510" y="375" width="180" height="43" class="band"/><text x="600" y="402" text-anchor="middle">Search</text><rect x="710" y="375" width="180" height="43" class="band"/><text x="800" y="402" text-anchor="middle">Booking</text><rect x="510" y="435" width="180" height="43" class="band"/><text x="600" y="462" text-anchor="middle">Payments</text><rect x="710" y="435" width="180" height="43" class="band"/><text x="800" y="462" text-anchor="middle">Reviews</text><text x="700" y="520" text-anchor="middle">Notifications</text></g>
<path d="M1060 155v60H700v35M1060 155v60H700v35" class="line"/>
<rect x="1030" y="250" width="250" height="100" class="band"/><text x="1155" y="287" text-anchor="middle" class="title">Event Bus / Queue</text><text x="1155" y="315" text-anchor="middle" class="small">async jobs, webhooks, indexing</text><path d="M925 400h105" class="line"/>
<rect x="170" y="650" width="1060" height="150" class="data"/><text x="700" y="685" text-anchor="middle" class="title">Data Layer</text><text x="310" y="740" text-anchor="middle" class="small">PostgreSQL + replicas</text><text x="550" y="740" text-anchor="middle" class="small">Redis cache</text><text x="790" y="740" text-anchor="middle" class="small">OpenSearch index</text><text x="1030" y="740" text-anchor="middle" class="small">Object storage / image CDN</text><path d="M700 550v100M1155 350v225H1030v75" class="line"/>
<rect x="60" y="250" width="290" height="100" class="box"/><text x="205" y="288" text-anchor="middle" class="title">CI/CD</text><text x="205" y="316" text-anchor="middle" class="small">Tests, container build,</text><text x="205" y="338" text-anchor="middle" class="small">serverless/container deploy</text><path d="M205 350v470h-40" class="line"/>
<rect x="60" y="650" width="80" height="150" class="band"/><text x="100" y="700" text-anchor="middle" class="small">Logs,</text><text x="100" y="725" text-anchor="middle" class="small">metrics,</text><text x="100" y="750" text-anchor="middle" class="small">traces,</text><text x="100" y="775" text-anchor="middle" class="small">backups</text><path d="M350 300h125M170 650v-80h530" class="line"/>
</svg>
